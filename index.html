ighest speed (25G on SFP28, 100G on QSFP28). Up to 8 units, NSF/hitless failover.","BoM_Impact":"Stack cables/optics must be 25G or 100G.","Source":"M4350 datasheet DS-M4350-30May25 (fw 14.0) [file: M3450_Datasheet_30May25.pdf]"},{"Rule_ID":"R03","Applies_To":"M4350 (all)","Area":"Features","Rule":"Stacking, AVB and PTP TC/BC/GM are mutually exclusive.","BoM_Impact":"If AVB or PTP (ST 2110/AES67 BC) is required, do not propose a stack; use LAG/MLAG-style design.","Source":"M4350 datasheet DS-M4350-30May25 (fw 14.0) [file: M3450_Datasheet_30May25.pdf]"},{"Rule_ID":"R04","Applies_To":"M4250 (all)","Area":"Features","Rule":"AVB is not supported on a LAG. Max 256 AVB streams per switch.","BoM_Impact":"AVB designs need single uplinks or MSTP, not LAG.","Source":"M4250 datasheet DS-M4250-9Nov23 (fw 13.0.4)"},{"Rule_ID":"R05","Applies_To":"M4350 full width","Area":"Power","Rule":"RPS+EPS work simultaneously: total budget (EPS) and protected budget (internal PSU failed) depend on PSU model, quantity and input voltage.","BoM_Impact":"When redundancy is required, size PoE to PoE_Budget_Protected_W (worst of internal-PSU or module failure), not the EPS total.","Source":"M4350 datasheet DS-M4350-30May25 (fw 14.0) [file: M3450_Datasheet_30May25.pdf]"},{"Rule_ID":"R06","Applies_To":"M4350","Area":"Power","Rule":"Two PSU groups: A (APS350W/600Wv2/920W/2000W) and B (APS600Wv3/1200Wv2/2000Wv2) are model-specific.","BoM_Impact":"Only offer PSUs listed in Compatibility for the chosen model.","Source":"M4350 datasheet DS-M4350-30May25 (fw 14.0) [file: M3450_Datasheet_30May25.pdf]"},{"Rule_ID":"R07","Applies_To":"APS2000W / APS2000Wv2","Area":"Power","Rule":"Output is 1,000W at 110VAC and 2,000W at 220VAC.","BoM_Impact":"Ask for site input voltage before sizing high PoE budgets.","Source":"M4350 datasheet DS-M4350-30May25 (fw 14.0) [file: M3450_Datasheet_30May25.pdf]"},{"Rule_ID":"R08","Applies_To":"M4250-26G4F-PoE++ / 40G8XF-PoE++","Area":"Power","Rule":"PoE budget scales with number of powered internal PSUs (720 / 1,440W; 720 / 1,650 / 2,880W).","BoM_Impact":"Budget = f(PSUs powered). Redundancy reduces usable budget.","Source":"M4250 datasheet DS-M4250-9Nov23 (fw 13.0.4)"},{"Rule_ID":"R09","Applies_To":"M4250 / M4350","Area":"PoE","Rule":"PoE+ ports: max 30W/port; Ultra90 PoE++ ports: 15.4/30/60/75/90W classes.","BoM_Impact":"Match endpoint class to port type; 60-90W endpoints need Ultra90 models.","Source":"M4250 + M4350 datasheets"},{"Rule_ID":"R10","Applies_To":"M4250-16XF","Area":"Ports","Rule":"1G SFP / AGM734 supported on ports 1-12 only.","BoM_Impact":"1G endpoints/uplinks limited to 12 per switch.","Source":"M4250 datasheet DS-M4250-9Nov23 (fw 13.0.4)"},{"Rule_ID":"R11","Applies_To":"M4350 multi-gig models","Area":"Ports","Rule":"100M support limited: see Port_Notes (e.g. 24X4V ports 1-16 only, 40X4C none, 10G ports on M4X4V none).","BoM_Impact":"Legacy 100M AV/control devices must land on supported ports.","Source":"M4350 datasheet DS-M4350-30May25 (fw 14.0) [file: M3450_Datasheet_30May25.pdf]"},{"Rule_ID":"R12","Applies_To":"PR460X","Area":"Management","Rule":"Managed by Insight OR Engage, not both. Exium security license only via Insight.","BoM_Impact":"If AV design uses Engage, no Exium license line.","Source":"PR460X datasheet NG_DS_AV_PR460X-042926"},{"Rule_ID":"R13","Applies_To":"PR460X","Area":"Capacity","Rule":"32 VLANs / 32 DHCP servers max; 2,000 clients.","BoM_Impact":"Flag designs with >32 VLANs/AV profiles.","Source":"PR460X datasheet NG_DS_AV_PR460X-042926"},{"Rule_ID":"R14","Applies_To":"WBE718","Area":"PoE","Rule":"PD draw 25W; 802.3at required for full performance (802.3af reduces throughput, disables 6GHz). 2.5G uplink.","BoM_Impact":"Needs PoE+ port; 2.5G port recommended.","Source":"WBE718 datasheet DS-WBE718_02Apr26"},{"Rule_ID":"R15","Applies_To":"WBE758","Area":"PoE","Rule":"PD draw 39W; 802.3bt for full performance (802.3at reduces throughput; 802.3af unsupported). 10G uplink.","BoM_Impact":"Needs Ultra90/PoE++ port; 10G multi-gig port recommended (e.g. M4350-36X4V / 40X4C / 24X8F8V).","Source":"WBE758 datasheet D-WBE758_29Jan24"},{"Rule_ID":"R16","Applies_To":"M4350-8M2V","Area":"Power","Rule":"Ships with 1x APS254W (119W). 2 more adapters: 322W (2 total) / 551W (3 total); redundant 119W (1+1) or 322W (2+1).","BoM_Impact":"Add APS254W qty per PoE need; optional PST4310 tray.","Source":"M4350 datasheet DS-M4350-30May25 (fw 14.0) [file: M3450_Datasheet_30May25.pdf]"},{"Rule_ID":"R17","Applies_To":"All switches","Area":"Environment","Rule":"Operating max: 45C PoE models, 50C non-PoE (M4250 12M2XF/16XF, M4350 non-PoE).","BoM_Impact":"Check rack ambient for closet/IDF installs.","Source":"M4250 + M4350 datasheets"},{"Rule_ID":"R18","Applies_To":"M4500-48XF8C","Area":"Ports","Rule":"SFP28 port speed is set per 4-port block (1G / 10G / 25G); ports ship at 10G.","BoM_Impact":"Group 1G, 10G and 25G optics in separate 4-port blocks.","Source":"M4500 datasheet DS-M4500-3Apr26"},{"Rule_ID":"R19","Applies_To":"PR460X","Area":"Cabling","Rule":"DAC and AOC cables are not compatible with the PR460X SFP+ port.","BoM_Impact":"Gateway to core uses a 10G SR optic on both ends and an LC patch cord.","Source":"ProAV Design team"},{"Rule_ID":"R20","Applies_To":"M4350-16M4V","Area":"Ports","Rule":"One interface card slot: APM414V (4x SFP28, installed), APM414C (4x 10GBASE-T), APM414SD/LD (opticalCON QUAD, MMF/SMF). One card at a time.","BoM_Impact":"Uplink media follows the card; opticalCON cards need SFP28/SFP+ transceivers in the internal cages and Neutrik opticalCON field cables.","Source":"M4350 datasheet DS-M4350-03Jul26 (M4350_Datasheet.pdf)"},{"Rule_ID":"R21","Applies_To":"M4350 (all)","Area":"AVB","Rule":"In a LAG only one physical link carries AVB payload; the other links are backup.","BoM_Impact":"AVB bandwidth through a LAG is one link, not the LAG total.","Source":"M4350 datasheet DS-M4350-03Jul26 (M4350_Datasheet.pdf)"}],"Endpoints":[{"Endpoint_ID":"EP-1G-TX","Name":"1G AV-over-IP e         notes.push({lvl:'info',msg:`Inter-core link sized for ${ISL_RULES[S.islRule||'half']}, and never below the busiest single switch: needs ${Math.round(core.islReq)} Gbps, provided ${core.isl} × ${core.islSpeed}G = ${core.isl*core.islSpeed} Gbps.`}); if(lk.tbd) notes.push({lvl:'warn',msg:`No ${core.islSpeed}G inter-core cable in the catalog. Placeholder added.`}); }
      support(p,core.k,loc);
      power.push({loc,model:p.Model_Name,n:core.k,poe:0,cfg:core.psu.label,eps:core.psu.eps,prot:core.psu.prot,budget:core.psu.budget,head:null,est:N(p.Power_Max_NoPoE_W),max:N(p.Power_Max_NoPoE_W),ru:N(p.Rack_Units),half:/Half/.test(p.Width_Class||'')});
    } else errors.push({loc:'Core',msg:'No '+(S.family==='Auto'?'':S.family+' ')+'core switch can terminate all uplinks with these settings. Each core needs '+Object.entries(coreDem.links).sort((a,b)=>b[0]-a[0]).map(([s,q])=>`${Math.ceil(q/(S.dualCore?2:1))} × ${s}G`).join(' + ')+' ports plus the core-to-core links.'+(S.family!=='Auto'?' Try Best fit.':'')+(S.family==='M4250'&&S.psuRed?' With redundant power on, the M4250-40G8XF-PoE++ is the only M4250 core option.':'')+((S.oversub||1)<2?' Or try 2:1 oversubscription.':'')+' A network this size may need an aggregation (spine/leaf) layer; contact the Pro AV Design team.'});
  }
  // uplink optics/cables: must suit the room switch and the core it lands on
  const coreLoc=mdfName+' (core)', corePorts=[];
  // Uplink card "opticalCON QUAD" (chosen by the user, never automatic): a switch with an interface card slot (M4350-16M4V)

  // so in-rack links use optics too (no DAC through opticalCON).
  const ocCard=(p,media)=>{ const want=media==='SMF'?'APM414LD':'APM414SD';
    return (cat.Compatibility||[]).some(r=>r.Scope_Type==='Product'&&r.Scope_Value===p.Product_ID&&r.Accessory_Base===want)?cat.Accessories.find(a=>a.Base_Model===want):null; };
  for(const r of res) if(r.L.card==='quad'&&!r.groups.some(g=>ocCard(g.best.p,'MMF'))) notes.push({lvl:'warn',msg:`${r.L.name}: opticalCON QUAD was selected, but this room's switch has no interface card slot (only the M4350-16M4V has one, in Neutrik rooms), so standard fiber is used.`});

    const lk=pickLink(cat,b.up.speed,inRack?'DAC':ctx.media,ctx.dist,inRack,core&&core.p?[p,core.p]:[p]), q=b.up.u*b.n;
    if(card){ add(card.Orderable_SKU,card.Description,b.n,'Optics',L.name,'opticalCON uplink card, replaces the shipped APM414V');
      notes.push({lvl:'info',msg:`${L.name}: the ${p.Model_Name} uplinks use the ${card.Base_Model} opticalCON QUAD card (${card.Media==='SMF'?'single mode':'multimode'}) with ${lk.sku} optics in its internal cages. Order Neutrik opticalCON QUAD field cables, and an opticalCON-to-LC fan-out at the ${core&&core.p?core.p.Model_Name:'other'} end (not in this BoM).`}); }
    // optics: one at the room switch, one at the core, each booked where it is installed
    if(lk.perLink===2&&core&&core.p){ add(lk.sku,lk.desc,q,lk.cat,L.name,lk.tp?'Third-party module, buy separately (room end)':lk.tbd?'Not in catalog yet':'Room end of uplinks'); add(lk.sku,lk.desc,q,lk.cat,coreLoc,lk.tp?'Third-party module, buy separately (core end)':lk.tbd?'Not in catalog yet':'Core end of room uplinks'); }
    else add(lk.sku,lk.desc,q*lk.perLink,lk.cat,L.name,lk.tbd?'Not in catalog yet':(lk.perLink===2?'2 per link (both ends)':'1 per link'));
    if(core&&core.p) corePorts.push({loc:L.name,speed:b.up.speed,perCore:q/(core.k||1),sku:lk.sku,kind:lk.perLink===2?'optic':'cable'});
    if(lk.tbd){ const reach=Math.max(0,...cat.Accessories.filter(a=>a.Category==='Optic'&&N(a.Speed_Gbps)===b.up.speed&&String(a.Media)===ctx.media).map(a=>N(a.Reach_m)));
      if(lk.tp) notes.push({lvl:'warn',msg:`${L.name}: no NETGEAR or validated optic.ca module reaches ${ctx.dist} m on ${ctx.media} at ${b.up.speed}G, so the BoM includes ${lk.sku}: ${thirdParty(b.up.speed,ctx.media,ctx.dist)}. Purchase it from a third party and confirm compatibility with the ProAV Design team, or use ${ctx.media==='MMF'?'single-mode fiber for this room':'a shorter run'} to stay with catalog optics.`});
      else if(b.up.pref) notes.push({lvl:'warn',msg:`${L.name}: ${b.up.speed}G was chosen as the uplink speed, but no NETGEAR or validated optic.ca module reaches ${ctx.dist} m on ${ctx.media}. The BoM lists a placeholder: ${thirdParty(b.up.speed,ctx.media,ctx.dist)}.`});
      else notes.push({lvl:'warn',msg:`${L.name}: no ${b.up.speed}G ${ctx.inRack?'cable':'optic'} in the catalog for ${ctx.dist} m`+(core&&core.p?` that fits both the ${p.Model_Name} and the ${core.p.Model_Name}`:'')+'. Placeholder added.'+(!ctx.inRack&&reach?` ${b.up.speed}G ${ctx.media} optics reach ${reach} m; use single-mode fiber (SMF) for this room or a shorter run.`:'')}); }
    links.push({loc:L.name,model:p.Model_Name,n:b.n,speed:b.up.speed,u:b.up.u,optic:lk.sku,dist:ctx.dist,media:inRack?'in-rack':(card?ctx.media+' opticalCON':ctx.media)});
  }
  if(S.gateway && units>0){ const gw=cat.Products.find(p=>p.Product_ID===gwId);
    if(gw){ add(regionSku(cat,gwId,S),`${gw.Model_Name}`,1,'Gateway',mdfName); support(gw,1,mdfName);
      if(gwOnCore){ const lk=pickLink(cat,10,'MMF',N(S.mdfPatch)||3,true,[core.p,gw]);
        add(lk.sku,lk.desc,lk.perLink,lk.cat,mdfName,lk.perLink===2?'Gateway to core: optic at both ends, plus an LC patch cord':'Gateway to core');
        gateway={loc:'core',model:core.p.Model_Name,via:lk.perLink===2?'fiber':'cable',sku:lk.sku,speed:10};
        corePorts.push({loc:gw.Model_Name,speed:10,perCore:1,sku:lk.sku,kind:lk.perLink===2?'optic':'cable',first:true});
        if(lk.perLink===2) notes.push({lvl:'info',msg:`${gw.Model_Name} does not take DAC/AOC cables, so it connects to the core with ${lk.sku} optics on both ends and a multimode LC patch cord.`}); }
      else if(units>0&&!errors.length){
        // no 10G port on the core (or standalone): place the router on a room switch, main room first, then the nearest closet.
        // "best" (default): the main room at any speed before a closet; "10g": a 10G port anywhere before a slower one.
        const cuMax=N(T.Copper_10G_Max_m)||100, rooms=[...res].sort((a,b)=>(a.L.type==='MDF'?0:1)-(b.L.type==='MDF'?0:1)||N(a.L.distance)-N(b.L.distance));
        const coreNote=core&&core.p&&!core.collapsed?` The ${core.p.Model_Name} core has no free 10G port.`:'';
        const place=(r,low)=>{ const mdf=r.L.type==='MDF', dist=mdf?(N(S.mdfPatch)||3):N(r.L.distance), media=r.L.media||'MMF';
          for(const g of r.groups){ const b=g.best, f=b.free||{}, sw=b.p;
            const cu=PT.some(t=>t.media==='Copper'&&supports(t,10)&&(f[t.col]||0)>0);
            // a free SFP28 port cannot run 10G next to 25G uplinks in the same 4-port block
            const fib=PT.some(t=>t.media==='Fiber'&&supports(t,10)&&(f[t.col]||0)>0&&!(t.cage==='SFP28'&&b.up.speed===25));
            if(cu&&dist<=cuMax){ gateway={loc:r.L.name,model:sw.Model_Name,via:'copper',dist,speed:10};

            if(fib){ const lk=pickLink(cat,10,media,dist,false,[sw,gw]);

                notes.push({lvl:'info',msg:`${gw.Model_Name} connects to a free 10G fiber port on the ${sw.Model_Name} in ${r.L.name} (${dist} m ${media}) with ${lk.sku} optics on both ends.`+coreNote}); return true; } }

            const t=dist<=100&&PT.filter(t=>t.media==='Copper'&&(f[t.col]||0)>0).sort((a,b)=>b.max-a.max)[0];
            if(t){ const sp=Math.min(10,t.max); gateway={loc:r.L.name,model:sw.Model_Name,via:'copper',dist,speed:sp};
              notes.push({lvl:sp<2.5?'warn':'info',msg:`${gw.Model_Name} link is ${sp}G: it uses a free ${sp}G copper port on the ${sw.Model_Name} in ${r.L.name} (${dist} m, Cat6 or better), because no 10G port is free there. ${sp>=2.5?'Enough for most internet uplinks (the PR460X 2.5G WAN port runs up to 2.4 Gbps).':'Fine for most internet uplinks.'}${core&&core.collapsed&&S.gwLink!=='10g'?' Set "Router link" to 10G required to reserve a 10G port.':''}`}); return true; }
            if(PT.some(t=>t.media==='Fiber'&&supports(t,1)&&(f[t.col]||0)>0)){ const lk=pickLink(cat,1,media,dist,false,[sw,gw]); if(lk.tbd) continue;
              add(lk.sku,lk.desc,lk.perLink,lk.cat,r.L.name,'Gateway link (1G): module at both ends');
              gateway={loc:r.L.name,model:sw.Model_Name,via:'fiber',sku:lk.sku,dist,speed:1};
              notes.push({lvl:'warn',msg:`${gw.Model_Name} link is only 1G: no free 10G or copper port is left, so it uses ${lk.sku} 1G modules on both ends (free SFP port on the ${sw.Model_Name} in ${r.L.name}, ${dist} m ${media}). Confirm the PR460X SFP+ port accepts a 1G module.`}); return true; }
          } return false; };
        const mdfRooms=rooms.filter(r=>r.L.type==='MDF'), others=rooms.filter(r=>r.L.type!=='MDF');
        const order=S.gwLink==='10g'?[[rooms,false],[rooms,true]]:[[mdfRooms,true],[others,false],[others,true]];
        for(const [list,low] of order){ if(gateway) break; for(const r of list) if(place(r,low)) break; }
        if(!gateway&&!standalone) errors.push({loc:'Gateway',msg:`No free 10G port for the ${gw.Model_Name}: the ${core&&core.p?core.p.Model_Name+' core':'core'} has none, and no room switch has a free 10G copper port within ${cuMax} m or a 10G fiber port with a compatible optic. Contact the Pro AV Design team to place the router.`});
      }
      if(S.taa && !isTAA(gw)) notes.push({lvl:'warn',msg:`${gw.Model_Name} has no TAA-compliant SKU in the catalog.`});
      power.push({loc:mdfName,model:gw.Model_Name,n:1,poe:0,cfg:'Internal PSU',eps:null,prot:null,budget:null,head:null,est:156,max:156,ru:N(gw.Rack_Units)||1,half:false}); } }
  const ptpDevs=coreDem.needBC||locs.some(L=>L.items.some(i=>i.ep.Timing==='PTP-BC'&&N(i.qty)));
  if(ptpDevs&&core&&core.p&&!core.collapsed&&!hasBC(core.p)&&(S.dualCore||res.some(r=>r.groups.some(g=>demandOf(g.items,S,true).needBC)))) tcUsed.add(`${core.p.Model_Name} (core)`);
  if(ptpDevs&&tcUsed.size) notes.push({lvl:'warn',msg:`ST 2110 / AES67 timing on PTP transparent clock: ${[...tcUsed].join(', ')} ${tcUsed.size>1?'have':'has'} transparent clock only. NETGEAR's datasheet lists ST 2110 support on the boundary-clock models (M4350-8M2V, 16M4V, 24M4X4V, 24F4X, 16V4C, 40X4C, 40F4C, 16C). Transparent clock suits small, flat networks; this design is not advised as is. Confirm with the ProAV Design team before ordering.`});
  else if(ptpDevs) notes.push({lvl:'info',msg:'Some devices need a PTP boundary clock (e.g. SMPTE 2059-2 / AES67), so only switches with PTP boundary clock were used for them and for the core.'});
  if(locs.some(L=>L.items.some(i=>i.ep.Timing==='AVB'&&N(i.qty)))) notes.push({lvl:'info',msg:'AVB / Milan devices: only AVB-capable switches were used. M4250 does not run AVB over a LAG, so M4250 switches with AVB devices get one uplink per core.'});
  if(N(S.upSpeed)){ const miss=[...new Set(links.filter(l=>l.speed!==N(S.upSpeed)).map(l=>l.loc))];
    if(miss.length) notes.push({lvl:'info',msg:`Preferred uplink speed ${S.upSpeed}G could not be used for ${miss.join(', ')}: the switch has no free ${S.upSpeed}G port, or ${S.upSpeed}G cannot carry the load within ${S.maxLag} links. The best automatic speed was used there.`}); }
  if(supIncl.size) notes.push({lvl:'info',msg:`Sprint ${supYrs} yr: ${[...supIncl].join(', ')} already include${supIncl.size>1?'':'s'} 3 years of Sprint, so no support SKU is added for ${supIncl.size>1?'them':'it'}.`});
  if(supMiss.size) notes.push({lvl:'warn',msg:`${TIERS[supTier]} is not listed for ${[...supMiss].join(', ')}, so no support SKU was added for ${supMiss.size>1?'them':'it'}. Choose another tier or check availability with NETGEAR.`});
  if(supTier) notes.push({lvl:'info',msg:'Support SKUs follow the NETGEAR pattern (SPR / DRV / FLS - model - months). Confirm each SKU and its price with NETGEAR or your distributor.'});
  if(S.taa) notes.push({lvl:'info',msg:'TAA: only switches with TAA-compliant SKUs were considered. TAA status of PSUs, optics and cables must be confirmed.'});
  if(locs.some(L=>L.items.some(i=>N(i.ep.PoE_W)>30&&N(i.qty)))) notes.push({lvl:'info',msg:'Devices above 30W need Ultra90 PoE++ (802.3bt) ports; only those switches were considered for them.'});
  notes.push({lvl:'info',msg:'Switches interconnect with LAG uplinks and IGMP Plus (no stacking), which keeps AVB and PTP available.'});
  notes.push({lvl:'info',msg:`Uplink LAGs use ${S.dualCore?'1, 2, 4 or 8 links to each core, and each core link group carries the switch\'s full load on its own so one core can fail':'1, 2, 4 or 8 links'} (sizes from Tool_Settings: ${S.lagSizes.join(', ')}), so LAG hashing spreads traffic evenly.`});
  if(S.family!=='Auto') notes.push({lvl:'info',msg:`Only ${S.family} switches were considered, for access and core.`});
  if(S.psuRed&&S.psuScope==='mdf') notes.push({lvl:'info',msg:'Redundant power applies to the main equipment room and core switches only. Closet switches use a single power supply; their PoE is sized to the full budget.'});
  if(S.psuRed) notes.push({lvl:'info',msg:'Redundant power: PoE is sized to the budget that remains if one power supply fails.'});
  for(const pw of power) if(pw.head!==null&&pw.head<0.1&&pw.poe>0) notes.push({lvl:'warn',msg:`${pw.loc}: ${pw.model} PoE headroom is only ${(pw.head*100).toFixed(0)}%.`});
  const totalEps=locs.reduce((s,L)=>s+L.items.reduce((a,i)=>a+N(i.qty),0),0);
  // what plugs into each core: room uplinks, core-to-core links, gateway (first core only)
  if(core&&core.p&&core.isl){ const lk=bom.find(b=>b.loc===coreLoc&&/Inter-core/.test(b.note)); corePorts.push({loc:core.k>1?'Other core':'',speed:core.islSpeed,perCore:core.isl,sku:lk?lk.sku:'',kind:'cable',isl:true}); }
  if(core&&core.p) core.ports=corePorts;
  return {dualCore:!!S.dualCore,bom,links,power,notes,errors,core,accessNodes,standalone,totalEps,settings:T,score,gateway};
}
// catalog validation used before publishing a new catalog
function validate(cat){
  const out=[], err=m=>out.push({lvl:'error',msg:m}), warn=m=>out.push({lvl:'warn',msg:m});
  for(const s of ['Products','SKUs','Accessories','PSU_PoE_Matrix','Port_Types','Endpoints']) if(!cat[s]||!cat[s].length) err(`Sheet ${s} is missing or empty.`);
  if(out.length) return out;
  const ids=new Set(); for(const p of cat.Products){ if(ids.has(p.Product_ID)) err(`Duplicate Product_ID ${p.Product_ID}.`); ids.add(p.Product_ID); }
  const ptc=new Set(cat.Port_Types.map(t=>t.Column_Name));
  const pcols=new Set(cat.Products.flatMap(p=>Object.keys(p)).filter(k=>/^Ports_/.test(k)));
  for(const c of pcols) if(!ptc.has(c)) err(`Products column ${c} has no row in Port_Types, so the tool cannot use it.`);
  for(const s of cat.SKUs) if(!ids.has(s.Product_ID)) warn(`SKU ${s.Orderable_SKU} points to unknown Product_ID ${s.Product_ID}.`);
  for(const r of cat.PSU_PoE_Matrix) if(!ids.has(r.Product_ID)) warn(`PSU_PoE_Matrix row points to unknown Product_ID ${r.Product_ID}.`);
  for(const p of cat.Products.filter(p=>p.Category==='Switch'&&(p.Lifecycle_Status||'Active')==='Active')) if(!cat.SKUs.some(s=>s.Product_ID===p.Product_ID)) warn(`${p.Model_Name} has no orderable SKU.`);
  for(const e of cat.Endpoints) if(!N(e.Link_Speed_Gbps)) warn(`Endpoint ${e.Name} has no link speed.`);
  return out;
}
return {design,demandOf,validate,settings,portTypes};

document.addEventListener('input',ev=>{
  const t=ev.target; if(!t.dataset||t.closest('#modal')||t.closest('#adminpage')) return;
  const val=t.type==='checkbox'?t.checked:(t.type==='number'?(t.value===''?'':+t.value):t.value);
  if(t.dataset.p){ let v=val; if(['dualUplink'].includes(t.dataset.p)&&t.tagName==='SELECT') v=(val==='true'); if(['voltage','oversub'].includes(t.dataset.p)) v=+val;
    state.project[t.dataset.p]=v; if(t.dataset.p==='dualCore'){ state.project.dualUplink=v; } }
  else if(t.dataset.lf){ state.locations[+t.closest('.loc').dataset.l][t.dataset.lf]=val; }
  else if(t.dataset.ef){ state.locations[+t.closest('.loc').dataset.l].eps[+t.closest('.ep').dataset.e][t.dataset.ef]=val; }
  else if(t.dataset.xf){ const e=state.endpoints[+t.closest('.lr').dataset.i]; e[t.dataset.xf]=t.dataset.xf==='Link_Speed_Gbps'?+val:val; }
  else return;
  if(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='radio') run(); else { save(); later(); } // typing: one design run 300 ms after the last keystroke
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act],[data-tab]'); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; renderResults(); return; }
  const loc=b.closest('.loc'), li=loc?+loc.dataset.l:-1, a=b.dataset.act;
  switch(a){
    case 'adde': state.locations[li].eps.push({ep:state.endpoints[0].Endpoint_ID,qty:1}); break;
    case 'dele': state.locations[li].eps.splice(+b.closest('.ep').dataset.e,1); break;
    case 'dell': state.locations.splice(li,1); break;
    case 'use': state.locations[li].override=b.dataset.pid; break;
    case 'addl': { const n=state.locations.filter(l=>l.type==='IDF').length+1; state.locations.push({id:nid(),name:'Closet '+n,type:'IDF',distance:100,media:'MMF',override:'Auto',eps:[{ep:'EP-1G-RX',qty:8}]}); break; }
    case 'adv': advOpen=!advOpen; break;
    case 'lib': libOpen=!libOpen; break;
    case 'addx': state.endpoints.push({Endpoint_ID:'EP-CUSTOM-'+Date.now().toString(36),Name:'Custom device',Category:'Custom',Link_Speed_Gbps:1,Media:'Copper',PoE_W:0,Stream_Mbps:100}); break;
    case 'delx': { const i=+b.closest('.lr').dataset.i, id=state.endpoints[i].Endpoint_ID; if(state.locations.some(L=>L.eps.some(e=>e.ep===id))){ toast('That device type is used in a room. Remove it there first.'); return; } state.endpoints.splice(i,1); break; }
    case 'reset': if(!confirmReset()) return; state=DEFAULT(); break;
    case 'xlsx': return exportXlsx(); case 'csv': return exportCsv(); case 'svg': return exportSvg(); case 'pdf': return exportPdf();
    case 'reqpdf': return reqPdf(b.dataset.u,b.dataset.r);
    case 'json': return packProject(state).then(b=>saveFile(`${slug()}${PJ_EXT}`,b));
    case 'loadjson': return $('#fjson').click();
    case 'request': return openModal();
    case 'close': return closeModal();
    case 'package': return buildPackage();
    case 'dlzip': if(PKG){ saveFile(PKG.name,PKG.blob); track('package'); } return;
    case 'addatt': return $('#rq-files').click();
    case 'delatt': ATT.splice(+b.dataset.i,1); return renderAtt();
    case 'pickcat': return $('#fcat').click();
    case 'publishcat': return publishCatalog();
    case 'discard': staged=null; return renderAdmin();
    case 'dlpkg': markViewed([[b.dataset.u,b.dataset.r]]); return downloadStored(b.dataset.u,b.dataset.r);
    case 'viewreq': { const r=b.dataset.r; if(OPEN.has(r)) OPEN.delete(r); else { OPEN.add(r); markViewed([[b.dataset.u,r]]); } return renderAdmin(); }
    case 'viewall': return markViewed(allReqs().filter(isNew).map(r=>[r.uid,r.rid]));
    case 'openreq': markViewed([[b.dataset.u,b.dataset.r]]); return openReq(b.dataset.u,b.dataset.r);
    case 'revert': CAT=BUILTIN; CATMETA={version:ENG.settings(BUILTIN).Catalog_Version,source:'Built-in catalog'}; catInfo(); break;
    default: return;
  }
  run();
});

const CATORDER=['Switches','Power','Optics','Cabling','Wireless','Gateway','Support'];
// BoM grouped by brand: NETGEAR first, then other suppliers (e.g. optic.ca) alphabetically, then third-party parts, then placeholders
const brandKey=r=>r.brand||'To be confirmed';
const brandRank=b=>b==='NETGEAR'?0:(b==='Third party'?2:(b==='To be confirmed'?3:1));
const BRAND_NOTE={'NETGEAR':'','optic.ca':'NETGEAR-certified modules and cables (KB 000066694). Order from optic.ca.','Third party':'Not in the NETGEAR catalog: buy separately and confirm compatibility with the ProAV Design team.','To be confirmed':'Not in the catalog yet: the ProAV Design team will confirm the part.'};
const brandNote=b=>BRAND_NOTE[b]!==undefined?BRAND_NOTE[b]:'Third-party supplier: order from the supplier and confirm compatibility.';
function rollup(){ const m={}; for(const b of result.bom){ if(!m[b.sku]) m[b.sku]={...b,locs:new Set()}; else m[b.sku].qty+=b.qty; m[b.sku].locs.add(b.loc); }
  return Object.values(m).sort((a,b)=>brandRank(brandKey(a))-brandRank(brandKey(b))||brandKey(a).localeCompare(brandKey(b))||CATORDER.indexOf(a.cat)-CATORDER.indexOf(b.cat)||a.sku.localeCompare(b.sku)); }
const brandsOf=rows=>[...new Set(rows.map(brandKey))];
function roomPower(l){ const V=state.project.voltage, r=result.power.filter(p=>p.loc===l); const w=r.reduce((s,p)=>s+p.est*p.n,0), mx=r.reduce((s,p)=>s+p.max*p.n,0), ru=r.reduce((s,p)=>s+(p.half?p.ru/2:p.ru)*p.n,0);
  const amps=w/V, cA=V>=200?16:20; return {w,mx,ru,amps,cA,circ:Math.max(1,Math.ceil(amps/(cA*0.8))),btu:w*3.412,va:w/0.9}; }
function stats(){ return {sw:result.bom.filter(b=>b.cat==='Switches').reduce((s,b)=>s+b.qty,0),eps:result.totalEps,poe:result.power.reduce((s,p)=>s+p.poe*p.n,0),est:result.power.reduce((s,p)=>s+p.est*p.n,0),ru:result.power.reduce((s,p)=>s+(p.half?p.ru/2:p.ru)*p.n,0)}; }

const PRINT={page:'#FFFFFF',bg:'#F8FAFC',box:'#E2E8F0',line:'#16A35E',txt:'#101520',mut:'#64748B',gw:'#64748B'};
function diagram(forExport,pal){
  const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(); // export uses the colours currently on screen
  const C=pal||(forExport?{page:cv('--bg')||'#101520',bg:cv('--bg2')||'#161d2b',box:cv('--box')||'#2B3749',line:cv('--accent')||'#26E880',txt:cv('--fg')||'#FFFFFF',mut:cv('--mut')||'#94A3B8',gw:cv('--mut')||'#94A3B8'}:{bg:'var(--bg2)',box:'var(--box)',line:'var(--accent)',txt:'var(--fg)',mut:'var(--mut)',gw:'var(--mut)'});
  const F="Outfit, Arial, sans-serif", nodes=result.accessNodes, locs=state.locations.filter(L=>nodes.some(n=>n.loc===L.name));
  if(!locs.length) return `<p class="empty">Add devices to a room to see the network.</p>`;

async function storePackage(blob,rid){ // ZIP kept as base64 chunks under packages/<uid>/ (admin-readable only)

  for(let i=0;i<parts;i++) await DB.doc(`packages/${UID}/parts/${rid}-${i}`).set({d:s.slice(i*CHUNK,(i+1)*CHUNK)});

// Standard browser download helper.
function browserDownload(name,data){ const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Saved '+name); }
// ---------- project files (.ntgrbom) ----------
// Saved projects are packed so they do not open as readable text: compressed, masked, plus a check value.
// This is obfuscation, not encryption (the key ships with the page). The check rejects files edited outside the tool.
const PJ_MAGIC='NTGRBOM', PJ_KEY='NETGEAR AV Network BoM builder', PJ_EXT='-project.ntgrbom';
const pjEnc=t=>new TextEncoder().encode(t);
const pjMask=u=>{ const k=pjEnc(PJ_KEY); for(let i=0;i<u.length;i++) u[i]^=k[i%k.length]^((i*31)&255); return u; };
const pjHash=u=>{ let a=0x811c9dc5, b=0xcbf29ce4; const step=x=>{ a=Math.imul(a^x,0x01000193)>>>0; b=Math.imul(b^x,0x5bd1e995)>>>0; b=(b^(b>>>13))>>>0; };
  for(const x of pjEnc(PJ_KEY)) step(x); for(let i=0;i<u.length;i++) step(u[i]); const o=new Uint8Array(8), d=new DataView(o.buffer); d.setUint32(0,a); d.setUint32(4,b); return o; };
const pjZip=async(u,dir)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(dir?new CompressionStream('gzip'):new DecompressionStream('gzip'))).arrayBuffer());
async function packProject(st){
  const json=pjEnc(JSON.stringify(st)), gz=!!window.CompressionStream, body=gz?await pjZip(json,true):json.slice(), head=pjEnc(PJ_MAGIC), H=head.length;
  const out=new Uint8Array(H+10+body.length); out.set(head); out[H]=1; out[H+1]=gz?1:0; out.set(pjHash(json),H+2); out.set(pjMask(body),H+10);
  return new Blob([out],{type:'application/octet-stream'});
}
async function unpackProject(buf){
  const u=new Uint8Array(buf), head=pjEnc(PJ_MAGIC), H=head.length;
  const first=u.findIndex(c=>c>32&&c!==0xEF&&c!==0xBB&&c!==0xBF);
  if(u[first]===0x7B) return JSON.parse(new TextDecoder().decode(u)); // older .json project files still open
  if(u.length<H+10||head.some((c,i)=>u[i]!==c)) throw new Error('this is not a BoM builder project file');
  if(u[H]!==1) throw new Error('it was saved by a newer version of the BoM builder');
  let body=pjMask(u.slice(H+10));
  if(u[H+1]===1){ if(!window.DecompressionStream) throw new Error('this browser cannot read it; use a current Chrome, Edge, Safari or Firefox');
    try{ body=await pjZip(body,false); }catch(e){ throw new Error('the file is damaged or was changed outside the BoM builder'); } }
  const h=u.slice(H+2,H+10); if(!pjHash(body).every((x,i)=>x===h[i])) throw new Error('the file is damaged or was changed outside the BoM builder');
  return JSON.parse(new TextDecoder().decode(body));
}
async function saveFile(name,data){
  try{ browserDownload(name,data); }

// Renders an SVG string to a PNG data URL (the diagram goes into the PDF as a sharp raster image).
function svgToPng(svg,w,h,scale){ return new Promise((ok,no)=>{ const img=new Image();
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=Math.round(w*scale); c.height=Math.round(h*scale); const g=c.getContext('2d'); g.scale(scale,scale); g.drawImage(img,0,0,w,h); ok(c.toDataURL('image/png')); };
  img.onerror=()=>no(new Error('image render failed')); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); }); }
// Outfit (NETGEAR corporate typeface) is embedded in the PDF; falls back to Helvetica if it cannot be fetched.
let OUTFIT=null; const OUTFIT_URL={normal:'https://fonts.gstatic.com/s/outfit/v15/QGYyz_MVcBeNP4NjuGObqx1XmO1I4TC1C4E.ttf',bold:'https://fonts.gstatic.com/s/outfit/v15/QGYyz_MVcBeNP4NjuGObqx1XmO1I4deyC4E.ttf'};
async function loadOutfit(){ if(OUTFIT) return OUTFIT; const b64=buf=>{ let s=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
  const out={}; for(const [k,u] of Object.entries(OUTFIT_URL)){ const r=await fetch(u); if(!r.ok) throw new Error('font'); out[k]=b64(await r.arrayBuffer()); } return OUTFIT=out; }
